name: sbi-workshop
channels:
  - pytorch
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - sbi
      - msprime
      - matplotlib
      - tskit
      - jupyter
      - ipykernel
      # Needed for notebook 5 (popgen-npe Soup-to-Nuts demo).
      # popgen-npe itself is not on PyPI — clone it as a sibling directory
      # of this repo (see README.md, "Notebook 5 setup") and install in
      # editable mode from there.
      - snakemake
